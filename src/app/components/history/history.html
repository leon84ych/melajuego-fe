<section class="history-card">
  <div class="history-header">
    <div>
      <h2>Tu Historial de Partidas</h2>
      <p class="history-description">Revisa tus resultados y borra el historial cuando quieras.</p>
    </div>
    <button class="btn-clear" type="button" (click)="clearAllHistory()">
      Eliminar historial
    </button>
  </div>

  <div class="batch-card" *ngFor="let session of paginatedHistory">
    <div class="batch-header">
      <strong>Sesión: {{ session.date }}</strong>
      <span>🟢 {{ session.correctCount }} | 🔴 {{ session.incorrectCount }}</span>
    </div>

    <app-card-swipe-score
      [percentScoreOverride]="getPercentScore(session)"
      [batchScoreOverride]="session.correctCount"
      [totalCardsOverride]="session.correctCount + session.incorrectCount"
      [batchErrorsOverride]="session.incorrectCount"
      [scoreColorOverride]="getScoreColor(session)"
      [profileReviewItemsOverride]="getSessionReviewItems(session)"
      [actionLabelOverride]="actionLabel"
      [expectedLabelOverride]="expectedLabel"
      [showActions]="false"
    ></app-card-swipe-score>
  </div>

  <div class="history-pagination" *ngIf="batchHistory.length > pageSize">
    <button class="btn-page" type="button" (click)="goPrevPage()" [disabled]="!canGoPrev">
      Anterior
    </button>
    <span class="page-indicator">Página {{ currentPage }} de {{ totalPages }}</span>
    <button class="btn-page" type="button" (click)="goNextPage()" [disabled]="!canGoNext">
      Siguiente
    </button>
  </div>
</section>
