<app-card-set
  (nextBatch)="nextBatch()"
  (restart)="restart()"
></app-card-set>

<div class="batch-actions" *ngIf="batchComplete && !isPlayingInRoom()">
    <button class="btn-action restart" type="button" (click)="nextBatch()">Jugar otra ronda</button>
    <button class="btn-action restart" type="button" (click)="restart()">Reiniciar todo</button>
</div>

@if (!batchStarted()) {
<app-card-swipe-room-scores></app-card-swipe-room-scores>
}
@if (isHost() && !batchStarted() && roomName().length > 0) {
<div class="room-duration-panel">
    <div class="result-summary">
        <div class="room-duration">
            <label for="duration-select" class="room-label">Duración de la partida</label>
            <select #durationSelect id="duration-select" class="duration-select" [value]="selectedDurationMinutes()"
                (change)="onDurationChange($event)">
                <option *ngFor="let option of durationOptions" [value]="option">{{ option }}m</option>
            </select>
        </div>

        <button class="btn-action start" (click)="requestBatchStart(durationSelect.value)">
            Iniciar partida
        </button>
    </div>

    <p class="room-batch-message" *ngIf="batchMessage()">{{ batchMessage() }}</p>
    <p class="room-message" *ngIf="roomMessage()">{{ roomMessage() }}</p>
</div>
}
